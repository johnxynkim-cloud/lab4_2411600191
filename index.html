<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Fitness Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page d-flex align-items-center justify-content-center">
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card login-card shadow-lg" style="max-width: 400px; width: 100%;">
      <div class="card-header custom-header text-center py-4">
        <img src="assets/logo.png" alt="TrackFit Logo" class="mb-2 bg-white p-2 rounded-3 shadow-sm" style="max-height: 60px; width: auto;">
        <h2 class="mb-0 fw-bold">TrackFit</h2>
        <p class="mb-0 small opacity-75">Welcome back! Ready to hit your goals?</p>
      </div>

      <div class="card-body p-4 bg-white">
        <div id="loginFeedback"></div>
        <form id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="username" placeholder="Enter username" required>
            </div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" placeholder="Enter password" required>
            </div>
          </div>
          
          <button type="button" class="btn btn-primary w-100 py-2 text-white fw-bold" id="loginBtn">Login</button>
        </form>
        <div class="text-center mt-3">
          <small class="text-muted">Demo credentials: <strong>admin</strong> / <strong>password123</strong></small>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
